# bant, a Bazel build file navigator: a small project whose dependencies all
# come from installed libraries.

name = "bant"
root = "//bant:bant"

[config]
values = { compilation_mode = "opt" }

[system.abseil-cpp]
dependencies = ["absl_base", "absl_strings", "absl_flat_hash_map", "absl_flat_hash_set", "absl_time"]
template = "absl_{name}"
optional = true

[system.re2]
dependencies = ["re2"]
