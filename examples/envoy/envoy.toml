# What to build and where its dependencies come from.

name = "envoy"
root = "//source/exe:envoy-static"

# Translations for rules beyond the standard C++/proto/genrule set; see
# bazel2meson/plugins. A name ending in .py is a file next to this one.
plugins = ["protoc_gen_validate", "cel_cpp"]

# Targets left out of the build.
exclude = [
  # Needs a Rust static library built with cargo, which is not wired up yet.
  "//source/extensions/dynamic_modules/builtin_extensions:hickory_dns_static",
  # Google ALTS uses gRPC-internal headers that an installed gRPC lacks.
  "//source/extensions/transport_sockets/alts:config",
]

# Repositories created by module extensions that duplicate a module.
[repo_aliases]
com_google_googleapis = "googleapis"

# Bazel repositories that are sub-directories of the Envoy tree.
[repos]
envoy_api = "api"
envoy_build_config = "source/extensions"

[config]
values = { compilation_mode = "opt" }

[config.defines]
tcmalloc = "disabled"

[config.flags]
"@proxy-wasm-cpp-host//bazel:engine" = "disabled"

# External repositories provided by installed libraries. Names are looked up
# with Meson's dependency(), i.e. pkg-config first, then CMake. "lib:NAME" is
# a library without either, found with the compiler's default search path.
# Bazel target names mostly match abseil's pkg-config names; the ones that
# differ are covered by what the listed libraries pull in.
[system.abseil-cpp]
dependencies = ["absl_base", "absl_strings", "absl_status", "absl_statusor", "absl_flat_hash_map", "absl_synchronization", "absl_time"]
template = "absl_{name}"
optional = true

[system.protobuf]
dependencies = ["protobuf"]

[system.grpc]
dependencies = ["grpc++"]

[system.boringssl]
dependencies = ["lib:ssl", "lib:crypto"]

[system.zlib-ng]
dependencies = ["zlib-ng"]

[system.brotli]
targets = { brotlidec = ["libbrotlidec"], brotlienc = ["libbrotlienc"] }

[system.c-ares]
dependencies = ["libcares"]

[system.flatbuffers]
dependencies = ["flatbuffers"]

[system.fmt]
dependencies = ["fmt"]

[system.libmaxminddb]
dependencies = ["libmaxminddb"]

[system.liburing]
dependencies = ["liburing"]

[system.luajit]
dependencies = ["luajit"]

[system.msgpack-c]
dependencies = ["msgpack-cxx"]

[system.nlohmann_json]
dependencies = ["nlohmann_json"]

[system.opentelemetry-cpp]
dependencies = ["opentelemetry_api"]

[system.re2]
dependencies = ["re2"]

# Envoy reaches into parts of spdlog that only its header-only mode exposes.
[system.spdlog]
dependencies = ["includes:spdlog"]
defines = ["SPDLOG_FMT_EXTERNAL"]

[system.tclap]
dependencies = ["tclap"]

[system.xxhash]
dependencies = ["libxxhash"]

[system.yaml-cpp]
dependencies = ["yaml-cpp"]

[system.antlr4-cpp-runtime]
dependencies = ["cmake:antlr4-runtime:antlr4_shared"]

[system.zstd]
dependencies = ["libzstd"]

# Envoy includes code generated from protos in gRPC's source tree, which the
# installed gRPC library does not ship.
[[extra_protos]]
root = "external/grpc"
files = ["src/proto/grpc/health/v1/health.proto"]

# Include paths that only exist in Bazel's view of a dependency, mapped to
# the header the installed library provides.
[forward_headers]
"include/nlohmann/json.hpp" = "nlohmann/json.hpp"
"third_party/utf8_range/utf8_validity.h" = "utf8_validity.h"
"src/google/protobuf/util/field_mask_util.h" = "google/protobuf/util/field_mask_util.h"

# Precompile the headers that at least a third of Envoy's sources include.
# Build with -Db_pch=false to compile without it.
[pch.envoy]
min_share = 0.33

# Repositories are named after their Bazel module.

# External repositories that are built from source because nixpkgs has no
# (compatible) package. `python -m bazel2meson.lock` pins them in sources.json.
[source]
cel-cpp = {}
cpp2sky = {}
dd-trace-cpp = {}
googleapis = {}
googleurl = {}
grpc-httpjson-transcoding = {}
hessian2-codec = {}
libcircllhist = {}
libevent = {}
# Envoy patches two extra options into nghttp2.
nghttp2 = {}
opentelemetry-proto = {}
prometheus-metrics-model = {}
proto-converter = {}
proto-field-extraction = {}
proto-processing = {}
protoc-gen-validate = {}
proxy-wasm-cpp-host = {}
proxy-wasm-cpp-sdk = {}
quiche = {}
wuffs = {}
xds = {}
zipkin-api = {}
cel-spec = {}
ocp-diag-core = {}
skywalking-data-collect-protocol = {}
