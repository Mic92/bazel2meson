# jaxlib's native extension modules, CPU only. Work in progress.

name = "jaxlib"
# The second root is a stand-in, see stubs/mlir_python/BUILD.bazel.
roots = ["//jaxlib:_jax", "@mlir_python//:core"]

plugins = ["tablegen", "cc_embed_data", "xla_llvm_ir", "python_extension"]

# Names XLA's extensions give repositories that are also modules.
[repo_aliases]
com_google_absl = "abseil-cpp"
com_google_protobuf = "protobuf"
com_googlesource_code_re2 = "re2"
com_github_grpc_grpc = "grpc"

[repos]
tsl = "external/xla/third_party/tsl"
# Stands in for the repository XLA's CUDA configuration rule generates.
local_config_cuda = "external/local_config_cuda"
mlir_python = "external/mlir_python"

[config]
values = { compilation_mode = "opt" }

# Installed libraries. XLA pins LLVM to a development commit; nixpkgs'
# llvmPackages_git is close to it. libLLVM is looked up as a plain library:
# Meson has a handler of its own for the name LLVM that wants component names.
[system.llvm-project]
dependencies = ["lib:LLVM", "cmake:MLIR:MLIR"]
# The shared libraries leave TableGen out; only build tools use it.
# The C API comes as static libraries.
[system.llvm-project.targets]
TableGen = ["lib:MLIRTableGen", "lib:LLVMTableGen"]
CAPIIR = ["lib:MLIRCAPIIR"]
CAPIAsync = ["lib:MLIRCAPIAsync"]
CAPIDebug = ["lib:MLIRCAPIDebug"]
CAPIInterfaces = ["lib:MLIRCAPIInterfaces"]
CAPITransforms = ["lib:MLIRCAPITransforms"]

[system.abseil-cpp]
dependencies = ["absl_base", "absl_strings", "absl_status", "absl_statusor", "absl_flat_hash_map", "absl_synchronization", "absl_time"]
template = "absl_{name}"
optional = true

[system.protobuf]
dependencies = ["protobuf"]

[system.grpc]
dependencies = ["grpc++"]

[system.boringssl]
dependencies = ["lib:ssl", "lib:crypto"]

[system.re2]
dependencies = ["re2"]

[system.zlib]
dependencies = ["zlib"]

[system.snappy]
dependencies = ["snappy"]

[system.curl]
dependencies = ["libcurl"]

[system.jsoncpp]
dependencies = ["jsoncpp"]

[system.org_sqlite]
dependencies = ["sqlite3"]

[system.highway]
dependencies = ["libhwy"]

[system.hwloc]
dependencies = ["hwloc"]

[system.farmhash_archive]
dependencies = ["lib:farmhash"]

[system.onednn_async]
dependencies = ["cmake:dnnl:DNNL::dnnl"]

[system.brotli]
targets = { brotlidec = ["libbrotlidec"], brotlienc = ["libbrotlienc"] }

[system.zstd]
dependencies = ["libzstd"]

[system.robin_map]
dependencies = ["cmake:tsl-robin-map:tsl::robin_map"]

# Python itself and its packages.
[system.rules_python]
dependencies = ["python3"]

# Only numpy's headers are used at build time.
[system.pypi]
dependencies = ["numpy"]

# Built from source: not in nixpkgs, or tied to XLA's LLVM pin.
[source]
xla = {}
stablehlo = {}
shardy = {}
gloo = {}
ducc = {}
highwayhash = {}
mpitrampoline = {}
riegeli = {}
slinky = {}
XNNPACK = {}
# XLA uses internals of a development commit; the 3.4 release lacks them.
eigen_archive = {}
# C++ headers of the Python package, which it does not install.
ml_dtypes_py = {}
# XLA uses enumerators newer than the releases in nixpkgs.
dlpack = {}
cpuinfo = {}
# XLA shares one nanobind between all modules; nixpkgs ships it as sources
# for CMake projects only.
nanobind = {}
